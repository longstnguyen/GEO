[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-ood"
version = "0.1.0"
description = "Research code for the GEO case study in the IEEE Access OOD survey"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Long S. T. Nguyen"}]
dependencies = ["torch>=2.4,<3", "torch-geometric>=2.6,<3", "torch-sparse>=0.6.18", "torch-scatter>=2.1.2", "numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "ogb>=1.3.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1"]

[project.scripts]
geo = "geo_ood.cli:main"

[project.urls]
Repository = "https://github.com/longstnguyen/GEO"
Paper = "https://doi.org/10.1109/ACCESS.2026.3717452"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
