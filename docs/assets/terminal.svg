<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" xml:space="preserve" role="img"><title>GEO experiment workspace</title><rect width="1100" height="400" rx="16" fill="#101D18"/><path d="M16 0H1084Q1100 0 1100 16V52H0V16Q0 0 16 0" fill="#20372F"/><circle cx="27" cy="26" r="7" fill="#EE8190"/><circle cx="50" cy="26" r="7" fill="#E8BE78"/><circle cx="73" cy="26" r="7" fill="#80BCA6"/><text x="103" y="33" font-family="Verdana,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#B7C7D8">GEO · experiment workspace</text><text x="28" y="88" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#E7EDF3">$ geo train --dataset cora --ood_type feature --method gnnsafe \</text><text x="28" y="117" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#C4CFDB">    --use_bn --use_prop --use_reg --use_occ --epochs 10 \</text><text x="28" y="146" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#C4CFDB">    --output outputs/cora-check</text><text x="28" y="175" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#FCF8EF"></text><text x="28" y="204" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#A6D7A5">outputs/cora-check/</text><text x="28" y="233" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#C4CFDB">  config.json        dataset, model, seed and loss settings</text><text x="28" y="262" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#C4CFDB">  environment.json   Python, PyTorch and CUDA versions</text><text x="28" y="291" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#C4CFDB">  run.log            training and validation trace</text><text x="28" y="320" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#C4CFDB">  metrics.json       selected-run detection metrics</text><text x="28" y="349" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill