<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" xml:space="preserve" role="img"><title>GEO experiment workspace</title><rect width="1100" height="400" rx="16" fill="#10141E"/><path d="M16 0H1084Q1100 0 1100 16V52H0V16Q0 0 16 0" fill="#1A2232"/><circle cx="27" cy="26" r="7" fill="#FF6B85"/><circle cx="50" cy="26" r="7" fill="#FEC547"/><circle cx="73" cy="26" r="7" fill="#36CDA0"/><text x="103" y="33" font-family="Verdana,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#A9BBD2">GEO · experiment workspace</text><text x="28" y="88" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#DCE5F2">$ geo train --dataset cora --ood_type feature --method gnnsafe \</text><text x="28" y="117" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#DCE5F2">    --use_bn --use_prop --use_reg --use_occ --epochs 10 \</text><text x="28" y="146" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#DCE5F2">    --output outputs/cora-check</text><text x="28" y="175" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#FCF8EF"></text><text x="28" y="204" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#70DBB0">outputs/cora-check/</text><text x="28" y="233" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#DCE5F2">  config.json        dataset, model, seed and loss settings</text><text x="28" y="262" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#DCE5F2">  environment.json   Python, PyTorch and CUDA versions</text><text x="28" y="291" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#DCE5F2">  run.log            training and validation trace</text><text x="28" y="320" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill="#DCE5F2">  metrics.json       selected-run detection metrics</text><text x="28" y="349" font-family="DejaVu Sans Mono,Menlo,monospace" font-size="19" fill